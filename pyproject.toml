[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmmc-scope"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0,<1.0",
    "rich>=13.7.0,<14.0",
    "boto3>=1.34.0,<2.0",
    "botocore>=1.34.0,<2.0",
    "PyGithub>=2.3.0,<3.0",
    "fpdf2>=2.7.9,<3.0",
]

[project.scripts]
cmmc-scope = "cmmc_scope.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cmmc_scope*"]